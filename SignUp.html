<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — MilkMarket</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream: #FBF7EF;
    --cream-deep: #F3EBDC;
    --forest: #2E5339;
    --forest-deep: #203C29;
    --butter: #E8A33D;
    --butter-deep: #C77F1F;
    --cocoa: #4A3728;
    --line: #E1D8C4;
    --white: #FFFFFF;
    --error: #C0392B;
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--cream);
    color: var(--cocoa);
    font-family: 'Inter', sans-serif;
    line-height: 1.55;
  }
  h1,h2,h3{ font-family: 'Fraunces', serif; color: var(--forest-deep); margin: 0; }
  a{ color: inherit; text-decoration: none; }
  img{ max-width: 100%; display: block; }

  /* ---------- NAVBAR (giống index) ---------- */
  .navbar{
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 6vw;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
    overflow: visible;
  }
  .brand{ display: flex; align-items: center; height: 100%; }
  .brand .logo-img{ height: 94px; width: auto; object-fit: contain; display: block; }
  .nav-links{ display: flex; gap: 2.2rem; font-size: .98rem; font-weight: 500; }
  .nav-links a{ position: relative; padding: 4px 0; color: var(--cocoa); }
  .nav-links a:hover{ color: var(--forest); }
  .nav-links a.active{ color: var(--forest); }
  .nav-links a.active::after{
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    height: 2px; background: var(--butter); border-radius: 2px;
  }

  /* ---------- BỐ CỤC: form trái | ảnh phải ---------- */
  .signup-wrap{
    display: grid;
    grid-template-columns: minmax(380px, 520px) 1fr;
    gap: 3rem;
    align-items: stretch;
    padding: 3rem 6vw;
    min-height: calc(100vh - 130px);
  }

  /* ----- Form (trái) ----- */
  .signup-card{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2.5rem 2.8rem;
    box-shadow: 0 10px 30px rgba(74,55,40,.08);
    align-self: center;
  }
  .signup-card h1{ font-size: 2rem; font-weight: 600; margin-bottom: .4rem; }
  .signup-sub{ color: #8a7a66; margin: 0 0 1.6rem; }

  .field{ margin-bottom: 1.1rem; }
  .field label{ display: block; font-size: .92rem; font-weight: 600; margin-bottom: 6px; }
  .field input{
    width: 100%; padding: 14px 16px;
    font: inherit; font-size: 1rem; color: var(--cocoa);
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input::placeholder{ color: #b3a690; }
  .field input:focus{
    outline: none; border-color: var(--butter);
    box-shadow: 0 0 0 3px rgba(232,163,61,.25);
  }
  .field.has-error input{ border-color: var(--error); }
  .error-msg{ display: block; min-height: 1.1em; margin-top: 4px; font-size: .8rem; color: var(--error); }

  .btn-signup{
    width: 100%; padding: 15px 0; border: none; border-radius: 12px; cursor: pointer;
    background: var(--forest); color: #fff;
    font: inherit; font-weight: 600; font-size: 1.05rem;
    margin-top: .4rem; transition: background .15s, transform .1s;
  }
  .btn-signup:hover{ background: var(--forest-deep); }
  .btn-signup:active{ transform: translateY(1px); }

  /* Nút chuyển sang trang đăng nhập */
  .switch-box{
    margin-top: 1.4rem; padding-top: 1.2rem;
    border-top: 1px solid var(--line);
    text-align: center; color: #8a7a66; font-size: .95rem;
  }
  .btn-to-login{
    display: block; margin-top: .7rem; padding: 13px 0;
    border: 1px solid var(--forest); border-radius: 12px;
    color: var(--forest); font-weight: 600;
    transition: background .15s, color .15s;
  }
  .btn-to-login:hover{ background: var(--forest); color: #fff; }

  /* ----- Ảnh (phải) ----- */
  .signup-image{
    border-radius: 24px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #fff 0%, var(--cream-deep) 75%);
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0,0,0,.15);
    min-height: 480px;
  }
  .signup-image img{
    width: 100%; height: 100%;
    object-fit: cover;           /* ảnh phủ kín khung, không méo */
    object-position: center;     /* chỉnh vị trí ảnh: top, 75% 0%... */
  }

  /* ---------- FOOTER (giống index) ---------- */
  footer{ background: var(--forest-deep); color: #E9E4D8; padding: 1.6rem 6vw; }
  .footer-bottom{
    font-size: .8rem; color: #8f8a7d;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
  }

  /* ---------- Điện thoại ---------- */
  @media (max-width: 820px){
    .navbar{ padding: 16px 5vw; flex-wrap: wrap; gap: 10px; }
    .nav-links{ gap: 1.2rem; font-size: .9rem; }
    .signup-wrap{ grid-template-columns: 1fr; padding: 1.8rem 5vw; min-height: auto; }
    .signup-card{ padding: 1.8rem 1.4rem; }
    .signup-image{ min-height: 240px; order: -1; }   /* ảnh lên trên, form xuống dưới */
  }
  /* Thông báo đăng ký (chữ đỏ) - trống thì tự ẩn */
/* Thông báo đăng ký (chữ đỏ) - trống thì tự ẩn */
.signup-alert{
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: #bd1a1a;
  text-align: center;
  margin: 0 0 1rem;
}
.signup-alert:empty{ display: none; }
</style>
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <a href="index.html" class="brand">
      <img src="Milkmarket.png" alt="MilkMarket Logo" class="logo-img">
    </a>
    <div class="nav-links">
      <a href="index.html">Trang chủ</a>
      <a href="cart.html">Giỏ hàng</a>
      <a href="about.html">Về chúng tôi</a>
      <a href="SignUp.html" class="active">Đăng ký</a>
    </div>
  </nav>

  <!-- ================= ĐĂNG KÝ ================= -->
  <main class="signup-wrap">

    <!-- Form bên trái -->
    <form class="signup-card" id="signup-form" novalidate>
      <h1>Đăng ký</h1>
      <p class="signup-sub">Tạo tài khoản để mua sắm nhanh hơn.</p>



      <div class="field">
        <label for="ho-ten">Họ và tên</label>
        <input type="text" id="ho-ten" placeholder="Cristiano Ronaldo" autocomplete="name">
        <span class="error-msg" id="loi-ho-ten"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Messi10@example.com" autocomplete="email">
        <span class="error-msg" id="loi-email"></span>
      </div>

      <div class="field">
        <label for="mat-khau">Mật khẩu</label>
        <input type="password" id="mat-khau" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
        <span class="error-msg" id="loi-mat-khau"></span>
      </div>

      <div class="field">
        <label for="xac-nhan">Xác nhận mật khẩu</label>
        <input type="password" id="xac-nhan" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
        <span class="error-msg" id="loi-xac-nhan"></span>
      </div>
<p id="thong-bao-dang-ky" class="signup-alert"></p>
      <button type="submit" class="btn-signup">Tạo tài khoản</button>

      <!-- Nút chuyển trang đăng nhập -->
      <div class="switch-box">
        Đã có tài khoản?
        <a href="Login.html" class="btn-to-login">Đăng nhập</a>
      </div>
      
    </form>

    <!-- Ảnh bên phải -->
    <div class="signup-image">
      <!-- 👉 GẮN LINK ẢNH Ở ĐÂY: thay DAN_LINK_ANH_VAO_DAY bằng link ảnh của bạn -->
      <img src="https://i.postimg.cc/VsCc39Kh/Gemini-Generated-Image-h0012qh0012qh001.png" alt="Ảnh MilkMarket">
    </div>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-bottom">
      <span>© 2026 milkmarket</span>
      <span>Demo giao diện — chưa tích hợp chức năng</span>
    </div>
  </footer>

<script>
const sigupform = document.getElementById('signup-form');
const thongBao= document.getElementById("thong-bao-dang-ky")
sigupform.addEventListener('submit',(e) =>{
  e.preventDefault(); //chặn form tải lại trang


 const hoTen   = document.getElementById("ho-ten").value.trim();
    const email   = document.getElementById("email").value.trim();
    const matKhau = document.getElementById("mat-khau").value;
    const xacNhan = document.getElementById("xac-nhan").value;

  // 1. Kiểm tra không được để trống
  if (hoTen === "" || email === "" || matKhau === "" || xacNhan === "") {
    thongBao.textContent = "Vui lòng nhập đầy đủ thông tin!";
    return; // dừng lại, không chạy tiếp
  }

  // 2. Kiểm tra định dạng email (dạng abc@xyz.com)
  const mauEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!mauEmail.test(email)) {
    thongBao.textContent = "Email không hợp lệ!";
    return;
  }

  // 3. Kiểm tra độ dài mật khẩu
  if (matKhau.length < 6) {
    thongBao.textContent = "Mật khẩu phải có ít nhất 6 ký tự!";
    return;
  }

  // 4. Kiểm tra xác nhận mật khẩu
  if (xacNhan !== matKhau) {
    thongBao.textContent = "Mật khẩu xác nhận không khớp!";
    return;
  }

  // 5. Kiểm tra email đã đăng ký chưa
  // Lấy mảng users từ localStorage, nếu chưa có thì dùng mảng rỗng
   if (localStorage.getItem("email") === email) {
    thongBao.textContent = "Email này đã được đăng ký!";
    return;
  }


    //luu local
     localStorage.setItem('name', hoTen);
localStorage.setItem('email', email);
localStorage.setItem('password', matKhau );
thongBao.style.color = "#2E5339";
  thongBao.textContent = "Đăng ký thành công!";
  signupForm.reset();


localStorage.setItem("dangNhap", "true"); // đánh dấu đã đăng nhập
  setTimeout(() => {
    window.location.href = "index.html";
  }, 1500);

})


</script>
</body>
</html>
