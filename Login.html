<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — MilkMarket</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --cream: #FBF7EF;
    --cream-deep: #F3EBDC;
    --forest: #2E5339;
    --forest-deep: #203C29;
    --butter: #E8A33D;
    --butter-deep: #C77F1F;
    --cocoa: #4A3728;
    --line: #E1D8C4;
    --white: #FFFFFF;
    --error: #C0392B;
  }

  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--cream);
    color: var(--cocoa);
    font-family: 'Inter', sans-serif;
    line-height: 1.55;
  }
  h1,h2,h3{ font-family: 'Fraunces', serif; color: var(--forest-deep); margin: 0; }
  a{ color: inherit; text-decoration: none; }
  img{ max-width: 100%; display: block; }

  /* ---------- NAVBAR (giống index) ---------- */
  .navbar{
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 6vw;
    background: var(--white);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 20;
    overflow: visible;
  }
  .brand{ display: flex; align-items: center; height: 100%; }
  .brand .logo-img{ height: 94px; width: auto; object-fit: contain; display: block; }
  .nav-links{ display: flex; align-items: center; gap: 2.2rem; font-size: .98rem; font-weight: 500; }
  .nav-links a{ position: relative; padding: 4px 0; color: var(--cocoa); }
  .nav-links a:hover{ color: var(--forest); }
  .nav-links a.active{ color: var(--forest); }
  .nav-links a.active::after{
    content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
    height: 2px; background: var(--butter); border-radius: 2px;
  }

  /* ---------- BỐ CỤC: ảnh trái | form phải ---------- */
  .login-wrap{
    display: grid;
    grid-template-columns: 1fr minmax(380px, 520px);   /* ảnh trái | form phải */
    gap: 3rem;
    align-items: stretch;
    padding: 3rem 6vw;
    min-height: calc(100vh - 130px);
  }

  /* ----- Ảnh (trái) ----- */
  .login-image{
    border-radius: 24px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #fff 0%, var(--cream-deep) 75%);
    border: 1px solid var(--line);
    box-shadow: 0 18px 40px rgba(0,0,0,.15);
    min-height: 480px;
  }
  .login-image img{
    width: 100%; height: 100%;
    object-fit: cover;           /* ảnh phủ kín khung, không méo */
    object-position: center;     /* chỉnh vị trí ảnh: top, 75% 0%... */
  }

  /* ----- Form (phải) ----- */
  .login-form{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2.5rem 2.8rem;
    box-shadow: 0 10px 30px rgba(74,55,40,.08);
    align-self: center;
  }
  .login-form h1{ font-size: 2rem; font-weight: 600; margin-bottom: .4rem; }
  .login-sub{ color: #8a7a66; margin: 0 0 1.6rem; }

  .field{ margin-bottom: 1.1rem; }
  .field label{ display: block; font-size: .92rem; font-weight: 600; margin-bottom: 6px; }
  .field input{
    width: 100%; padding: 14px 16px;
    font: inherit; font-size: 1rem; color: var(--cocoa);
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input::placeholder{ color: #b3a690; }
  .field input:focus{
    outline: none; border-color: var(--butter);
    box-shadow: 0 0 0 3px rgba(232,163,61,.25);
  }

  /* Thông báo đăng nhập (chữ đỏ) - trống thì tự ẩn */
  .login-alert{
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #bd1a1a;
    text-align: center;
    margin: 0 0 1rem;
  }
  .login-alert:empty{ display: none; }

  .btn-login-submit{
    width: 100%; padding: 15px 0; border: none; border-radius: 12px; cursor: pointer;
    background: var(--forest); color: #fff;
    font: inherit; font-weight: 600; font-size: 1.05rem;
    margin-top: .4rem; transition: background .15s, transform .1s;
  }
  .btn-login-submit:hover{ background: var(--forest-deep); }
  .btn-login-submit:active{ transform: translateY(1px); }

  /* Nút chuyển sang trang đăng ký */
  .switch-box{
    margin-top: 1.4rem; padding-top: 1.2rem;
    border-top: 1px solid var(--line);
    text-align: center; color: #8a7a66; font-size: .95rem;
  }
  .btn-to-signup{
    display: block; margin-top: .7rem; padding: 13px 0;
    border: 1px solid var(--forest); border-radius: 12px;
    color: var(--forest); font-weight: 600;
    transition: background .15s, color .15s;
  }
  .btn-to-signup:hover{ background: var(--forest); color: #fff; }

  /* ---------- FOOTER (giống index) ---------- */
  footer{ background: var(--forest-deep); color: #E9E4D8; padding: 1.6rem 6vw; }
  .footer-bottom{
    font-size: .8rem; color: #8f8a7d;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem;
  }

  /* ---------- Điện thoại ---------- */
  @media (max-width: 820px){
    .navbar{ padding: 16px 5vw; flex-wrap: wrap; gap: 10px; }
    .nav-links{ gap: 1.2rem; font-size: .9rem; }
    .login-wrap{ grid-template-columns: 1fr; padding: 1.8rem 5vw; min-height: auto; }
    .login-form{ padding: 1.8rem 1.4rem; }
    .login-image{ min-height: 240px; }   /* ảnh ở trên, form ở dưới */
  }
</style>
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <nav class="navbar">
    <a href="index.html" class="brand">
      <img src="Milkmarket.png" alt="MilkMarket Logo" class="logo-img">
    </a>
    <div class="nav-links">
      <a href="index.html">Trang chủ</a>
      <a href="cart.html">Giỏ hàng</a>
      <a href="about.html">Về chúng tôi</a>
      <a href="Login.html" class="active">Đăng nhập</a>
    </div>
  </nav>

  <!-- ================= ĐĂNG NHẬP ================= -->
  <main class="login-wrap">

    <!-- Ảnh bên trái -->
    <div class="login-image">
      <!-- 👉 GẮN LINK ẢNH Ở ĐÂY: thay DAN_LINK_ANH_VAO_DAY bằng link ảnh của bạn -->
      <img src="https://i.postimg.cc/RhkLWBBs/Gemini-Generated-Image-a0ludfa0ludfa0lu.png" alt="Ảnh MilkMarket">
    </div>

    <!-- Form bên phải -->
    <form class="login-form" id="login-form" novalidate>
      <h1>Đăng nhập</h1>
      <p class="login-sub">Đăng nhập để mua sắm nhanh hơn.</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="Messi10@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="mat-khau">Mật khẩu</label>
        <input type="password" id="mat-khau" placeholder="Nhập mật khẩu" autocomplete="current-password">
      </div>

      <p id="thong-bao-dang-nhap" class="login-alert"></p>

      <button type="submit" class="btn-login-submit">Đăng nhập</button>

      <!-- Nút chuyển trang đăng ký -->
      <div class="switch-box">
        Chưa có tài khoản?
        <a href="SignUp.html" class="btn-to-signup">Đăng ký</a>
      </div>
    </form>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="footer-bottom">
      <span>© 2026 milkmarket</span>
      <span>Demo giao diện — chưa tích hợp chức năng</span>
    </div>
  </footer>

  <script src="login.js">

  </script>
</body>
</html>
